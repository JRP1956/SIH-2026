services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibeguard}
      POSTGRES_DB: vibeguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeguard -d vibeguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://vibeguard:${POSTGRES_PASSWORD:-vibeguard}@db:5432/vibeguard
      - JWT_SECRET=${JWT_SECRET:-secret}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - COOKIE_CROSS_SITE=${COOKIE_CROSS_SITE:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    profiles:
      - full

volumes:
  pgdata:
